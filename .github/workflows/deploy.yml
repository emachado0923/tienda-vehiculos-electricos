name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    # Corre en el runner instalado en el Droplet (gratis, sin límite de minutos)
    runs-on: self-hosted

    steps:
      # ── 1. Código fuente ──────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Build de la imagen Docker ──────────────────────────────────────
      - name: Build image
        run: |
          docker build -t tienda-emc:latest -t tienda-emc:${{ github.sha }} .

      # ── 3. Aplicar migraciones y reiniciar la app ─────────────────────────
      - name: Deploy
        run: |
          set -euo pipefail
          cd /opt/tienda-emc

          # Actualizar la imagen en docker-compose con el tag del commit
          docker compose up -d --no-deps --build app

          # Limpiar imágenes antiguas (conserva las 2 últimas)
          docker image prune -f

          echo "✅ Despliegue completado — $(date)"
