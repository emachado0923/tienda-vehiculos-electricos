name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    # Corre en el runner instalado en el Droplet (gratis, sin límite de minutos)
    runs-on: self-hosted

    steps:
      # ── 1. Código fuente ──────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Build de la imagen Docker ──────────────────────────────────────
      - name: Build image
        run: |
          docker build -t tienda-emc:latest -t tienda-emc:${{ github.sha }} .

      # ── 3. Sincronizar configs y reiniciar la app ────────────────────────
      - name: Deploy
        run: |
          set -euo pipefail

          # Copiar configs actualizados desde el repo al directorio de la app
          cp docker-compose.yml /opt/tienda-emc/docker-compose.yml
          cp nginx/nginx.conf   /opt/tienda-emc/nginx/nginx.conf

          cd /opt/tienda-emc

          # Levantar/reiniciar solo el contenedor de la app
          docker compose up -d --no-deps app

          # Limpiar imágenes antiguas
          docker image prune -f

          echo "✅ Despliegue completado — $(date)"
