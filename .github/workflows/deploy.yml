name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tienda-vehiculos-electricos

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # permite push a ghcr.io con GITHUB_TOKEN

    steps:
      # ── 1. Código fuente ──────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. BuildKit multi-plataforma ─────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Login en GitHub Container Registry ────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Build + Push (etiqueta :latest y :<sha>) ───────────────────────
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Caché en GitHub Actions para acelerar builds sucesivos
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 5. Despliegue en el Droplet via SSH ───────────────────────────────
      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ env.IMAGE }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE
          script: |
            set -euo pipefail

            # Autenticar en GHCR para poder hacer pull
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            cd /opt/tienda-emc

            # Actualizar la imagen
            docker compose pull app

            # Reiniciar solo el contenedor de la app (sin recrear DB ni Nginx)
            docker compose up -d --no-build --no-deps app

            # Limpiar imágenes antiguas
            docker image prune -f

            echo "✅ Despliegue completado"
