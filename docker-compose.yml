# =============================================================
#  Stack de producción — DigitalOcean Droplet
#
#  Servicios:
#    app    → Next.js standalone (puerto interno 8080)
#    db     → MySQL 8
#    nginx  → Reverse proxy + SSL (puertos 80 / 443)
#    certbot→ Renovación automática de certificados Let's Encrypt
#
#  Uso inicial:
#    Copiar .env.example → .env y completar los valores,
#    luego ejecutar el script deploy/setup-droplet.sh
# =============================================================

services:

  # ── Aplicación Next.js ────────────────────────────────────────────────────
  app:
    image: ghcr.io/emachado0923/tienda-vehiculos-electricos:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOSTNAME: "0.0.0.0"
      AUTH_TRUST_HOST: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Almacenamiento local de imágenes subidas (si no se usa GCS)
      - uploads:/app/storage
    networks:
      - internal
      - web

  # ── MySQL 8 ───────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tienda}
      MYSQL_USER: ${MYSQL_USER:-tienda}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - root
        - --password=${MYSQL_ROOT_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ── Nginx (reverse proxy + SSL) ───────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - web

  # ── Certbot (renovación automática cada 12 h) ─────────────────────────────
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # Comprueba si hay renovación pendiente cada 12 horas
    entrypoint: >
      /bin/sh -c "trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done"

# ── Volúmenes persistentes ────────────────────────────────────────────────
volumes:
  mysql_data:
  uploads:
  certbot_www:
  certbot_conf:

# ── Redes ─────────────────────────────────────────────────────────────────
networks:
  internal:   # DB solo accesible desde la app
  web:        # Nginx ↔ app
