# =============================================================
#  Nginx — Reverse Proxy para EMC Positive Energy
#
#  Reemplaza TU_DOMINIO.COM por tu dominio real antes de usar.
#  Ejemplo: emc-positive.com
#
#  Primer despliegue (sin certificado aún):
#    1. Comenta el bloque "server 443" completo.
#    2. En el bloque 80, comenta el "return 301" y agrega:
#         location / { proxy_pass http://app:8080; ... }
#    3. Levanta nginx: docker compose up -d nginx
#    4. Obtén el certificado: ver deploy/setup-droplet.sh
#    5. Descomenta todo y recarga: docker compose exec nginx nginx -s reload
# =============================================================

# ── HTTP: solo ACME challenge + redirect a HTTPS ─────────────────────────
server {
    listen 80;
    server_name TU_DOMINIO.COM www.TU_DOMINIO.COM;

    # Certbot necesita este path para la validación del dominio
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: proxy hacia la app ─────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name TU_DOMINIO.COM www.TU_DOMINIO.COM;

    # Certificados emitidos por Certbot
    ssl_certificate     /etc/letsencrypt/live/TU_DOMINIO.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO.COM/privkey.pem;

    # Seguridad TLS mínima recomendada
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                               always;
    add_header X-Frame-Options           SAMEORIGIN                            always;

    # Subida de imágenes — permite archivos de hasta 20 MB
    client_max_body_size 20M;

    # ── Proxy hacia la app Next.js ────────────────────────────────────────
    location / {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Timeouts generosos para SSR pesado
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }

    # ── Archivos estáticos de Next.js (_next/static) ──────────────────────
    location /_next/static/ {
        proxy_pass         http://app:8080;
        proxy_cache_valid  200 365d;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }
}
